name: Check yt-dlp Updates & Auto-Release

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force release even if yt-dlp version has not changed'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write

jobs:
  check-and-release:
    name: Check Upstream yt-dlp & Auto-Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Pytest & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Check Upstream yt-dlp Version
        id: check_ytdlp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/check_ytdlp_update.py ${{ github.event.inputs.force && '--force' || '' }}

      - name: Bump Version Across Codebase
        if: steps.check_ytdlp.outputs.update_available == 'true'
        run: |
          python3 scripts/bump_version.py \
            --version "${{ steps.check_ytdlp.outputs.next_app_version }}" \
            --ytdlp "${{ steps.check_ytdlp.outputs.latest_ytdlp }}"

      - name: Run Test Suite Verification
        if: steps.check_ytdlp.outputs.update_available == 'true'
        run: |
          python -m pytest tests/ -v

      - name: Commit, Tag & Push Release
        if: steps.check_ytdlp.outputs.update_available == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): bump version to ${{ steps.check_ytdlp.outputs.next_app_version }} (yt-dlp ${{ steps.check_ytdlp.outputs.latest_ytdlp }})"
          git tag -a "${{ steps.check_ytdlp.outputs.next_app_version }}" -m "Release ${{ steps.check_ytdlp.outputs.next_app_version }} with upstream yt-dlp ${{ steps.check_ytdlp.outputs.latest_ytdlp }}"
          git push origin main
          git push origin "${{ steps.check_ytdlp.outputs.next_app_version }}"

      - name: Create GitHub Release
        if: steps.check_ytdlp.outputs.update_available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ steps.check_ytdlp.outputs.next_app_version }}"
          YTDLP_VER="${{ steps.check_ytdlp.outputs.latest_ytdlp }}"
          
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG - Bundled yt-dlp $YTDLP_VER" \
            --notes "## 🚀 Automated Release $RELEASE_TAG

          This release incorporates upstream **yt-dlp \`$YTDLP_VER\`**, ensuring full compatibility with YouTube's latest signature cipher and streaming format updates.

          ### Highlights
          - **Core Downloader Engine**: Upgraded to \`yt-dlp\` \`$YTDLP_VER\`.
          - **Automated Builds**: Android APK (\`YouTube-Downloader.apk\`) and Desktop binaries (Windows Standalone ZIP, Linux AppImage/tar.gz) attached below.
          - **In-App Updater**: Mobile and desktop apps will prompt to update automatically.

          ---
          *Automated release generated by GitHub Action.*"

      - name: Trigger Android & Desktop Build Workflows
        if: steps.check_ytdlp.outputs.update_available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ steps.check_ytdlp.outputs.next_app_version }}"
          echo "Triggering Android APK build for $RELEASE_TAG..."
          gh workflow run build-android.yml -f tag_name="$RELEASE_TAG"
          echo "Triggering Desktop build for $RELEASE_TAG..."
          gh workflow run build-desktop.yml -f tag_name="$RELEASE_TAG"
          echo "All release workflows dispatched successfully!"
