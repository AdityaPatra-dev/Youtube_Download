name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to attach APK to (e.g. v1.4.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11 (for Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for release
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/YouTube-Downloader.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Downloader-Android-APK
          path: release-apk/YouTube-Downloader.apk

      - name: Determine Release Tag
        id: get_tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            VER=$(python3 -c "import re; f=open('app.py').read(); m=re.search(r'current_ver\s*=\s*[\"\']([^\"\']+)[\"\']', f); print(m.group(1) if m else 'v1.4.0')")
            echo "tag=$VER" >> $GITHUB_OUTPUT
          fi

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          files: release-apk/YouTube-Downloader.apk

