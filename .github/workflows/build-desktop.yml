name: Build Desktop Releases (Windows & Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to attach desktop assets to (e.g. v1.4.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Standalone (.exe)
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pywebview pythonnet

      - name: Download bundled Windows binaries (FFmpeg & yt-dlp)
        run: |
          python packaging/windows/setup_ffmpeg.py

      - name: Build Windows executable with PyInstaller
        run: |
          pyinstaller --noconfirm packaging/windows/app.spec

      - name: Archive Windows build artifact
        run: |
          Compress-Archive -Path dist/YouTubeDownloader -DestinationPath dist/YouTube-Downloader-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Downloader-Windows-x64
          path: dist/YouTube-Downloader-Windows-x64.zip

  build-linux:
    name: Build Linux Portable AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies & FUSE
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 ffmpeg wget

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Linux AppImage
        run: |
          chmod +x packaging/linux/build_appimage.sh packaging/linux/AppRun
          bash packaging/linux/build_appimage.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Downloader-Linux-x86_64
          path: |
            dist/YouTube-Downloader-x86_64.AppImage
            dist/YouTube-Downloader-Linux-x86_64.tar.gz

  publish-release:
    name: Publish Release Assets
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List downloaded release assets
        run: ls -la release-assets

      - name: Determine Release Tag
        id: get_tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            VER=$(python3 -c "import re; f=open('app.py').read(); m=re.search(r'current_ver\s*=\s*[\"\']([^\"\']+)[\"\']', f); print(m.group(1) if m else 'v1.4.0')")
            echo "tag=$VER" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true

