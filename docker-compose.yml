services:
  youtube-downloader:
    build:
      context: .
      dockerfile: Dockerfile
    image: adityapatra/youtube-downloader:latest
    container_name: youtube-downloader
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./downloads:/app/downloads
    environment:
      - HOST=0.0.0.0
      - PORT=8000

